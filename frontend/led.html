<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Orders LED Display</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/order.css">
</head>
<body class="led-body">

  <header class="led-header">
    <div>
      <h1 id="led-restaurant-name">Live Order Board</h1>
      <p class="led-sub" id="led-sync-status">Connecting to live kitchen feed…</p>
    </div>
    <div class="led-controls">
      <span id="led-clock" class="led-clock">--:--:--</span>
      <button type="button" class="btn btn-secondary btn-sm" id="led-kitchen-auth-btn">👨‍🍳 Kitchen Access</button>
      <button type="button" class="btn btn-secondary btn-sm" id="led-mode-btn">Mode: Kitchen (Items)</button>
      <button type="button" class="btn btn-secondary btn-sm" id="led-sound-btn">🔔 Sound: ON</button>
      <button type="button" class="btn btn-primary btn-sm" id="led-fullscreen-btn">⛶ Fullscreen</button>
    </div>
  </header>

  <main class="led-grid">
    <section class="led-col led-col-pending">
      <div class="led-col-head">
        <h2>🔔 New Orders</h2>
        <span id="led-count-pending" class="led-count">0</span>
      </div>
      <div id="led-list-pending" class="led-list"></div>
    </section>

    <section class="led-col led-col-preparing">
      <div class="led-col-head">
        <h2>👨‍🍳 Accepted &amp; Preparing</h2>
        <span id="led-count-preparing" class="led-count">0</span>
      </div>
      <div id="led-list-preparing" class="led-list"></div>
    </section>

    <section class="led-col led-col-ready">
      <div class="led-col-head">
        <h2>✅ Ready to Serve</h2>
        <span id="led-count-ready" class="led-count">0</span>
      </div>
      <div id="led-list-ready" class="led-list"></div>
    </section>
  </main>

  <!-- Kitchen Staff Sign-In Modal -->
  <dialog id="led-auth-modal" class="app-modal co-modal">
    <h2 class="co-modal-title">👨‍🍳 Kitchen Staff Access</h2>
    <p class="co-muted" style="text-align: left; margin-bottom: 0.85rem;">
      Sign in once on this kitchen screen to Accept, Mark Ready, and Complete orders.
    </p>
    <form id="led-auth-form">
      <div class="form-group">
        <label class="form-label" for="led-auth-email">Username</label>
        <input type="text" class="form-input" id="led-auth-email" required autocomplete="username" placeholder="Enter the username">
      </div>
      <div class="form-group">
        <label class="form-label" for="led-auth-password">Password</label>
        <div class="password-wrap">
          <input type="password" class="form-input" id="led-auth-password" required minlength="6" autocomplete="current-password" placeholder="Enter the password">
          <button type="button" class="password-toggle-btn" id="led-toggle-password" aria-label="Show password">👁️</button>
        </div>
      </div>
      <p id="led-auth-error" class="co-form-error" role="alert" hidden></p>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" id="led-auth-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm" id="led-auth-submit">Sign In</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/led.js"></script>
</body>
</html>
